include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # The old Firestore proof of concept (reference only, not compiled).
    - legacy_poc/**
    # Generated by the backend (SQL Connect SDK) — never edited here.
    - lib/dataconnect_generated/**

linter:
  rules:
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_final_locals: true
    use_super_parameters: true
    avoid_print: true
