# ============================================================================
# +Prayer — SQL Connect schema (MVP)
# ============================================================================
# Managed PostgreSQL via Firebase SQL Connect. Region: us-central1.
#
# SCOPE: Core daily-prayer loop only. Groups, sharing, and usernames are
# DEFERRED — but the core is deliberately shaped so they become clean additive
# changes (nullable columns / new tables), never painful migrations.
# Updated 2026-10-18 from docs/product/schema-brief.md, incl. its §8 review
# answers (every change there names the spec file that justifies it).
#
# SYNTAX NOTE: verified 2026-10-18 against the directive prelude generated by
# firebase-tools 15.22.1 (dataconnect/.dataconnect/schema/prelude.gql) and
# validated in the SQL Connect emulator. Facts this file relies on:
#   - An optional reference (`x: T`) is ON DELETE SET NULL; a required one
#     (`x: T!`) is ON DELETE CASCADE. There is no onDelete argument.
#   - Composite uniqueness = `@unique(fields: [...])` on the type (repeatable).
#     Postgres treats NULLs as distinct inside a unique constraint.
#   - There is NO CHECK-constraint directive. Cross-field rules ("exactly one
#     of", "required when kind = INTENTION") are enforced by operations
#     (@check) and functions, and noted on each field below.
#   - There is no time-of-day scalar; local times are "HH:mm" Strings.
#
# Not stored here (by design): live presence and the live current-list count
# (RTDB — see docs/product/presence-live.md), in-progress prayer drafts (RTDB
# /presence/{uid}/{deviceId}), and tunables like the 30h gate window or grace
# cap (server params / RTDB /config — see schema-brief §5).
#
# ----------------------------------------------------------------------------
# COUNTS & STREAKS MODEL (read this before adding any count/streak columns)
# ----------------------------------------------------------------------------
# Principle: DERIVE on read; do NOT store derived data until a read is a
# MEASURED bottleneck. A stored aggregate buys read speed at the cost of write
# complexity and the risk of drift (a stored copy silently disagreeing with the
# source of truth). Most of the stats below are computed with ONE operation from
# existing tables, and a computed value is always correct by construction.
#
# Three "prayed for" counts a subject (e.g. "Mom") can show, all DERIVED:
#
#   TIER 1 — "I prayed for Mom N times" (personal, intimate)
#     BOTH semantics are supported (decided):
#       (a) raw "times I logged a prayer for her" = count of PrayerSubjectLink
#           rows for Mom's subject across the user's prayers.
#       (b) "list cycles I prayed for her on" = count of DISTINCT
#           Prayer.listContextNumber among those prayers (the per-cycle view).
#     Prayer.listContextNumber (always set) is what makes (b) work even for
#     personal-only prayers that aren't tied to the community list.
#     ALWAYS filter by Prayer.user — a link may later point at a subject owned
#     by someone else (shared via a group). Never assume prayer.user == owner.
#
#   TIER 2 — "my group prayed for Mom N times" (later, with groups)
#     Same shape as tier 3 but scoped to a bounded group context. Deferred.
#
#   TIER 3 — "the world prayed for Mom N times" (awe)
#     DEFINITION (core mechanic): praying for a list credits EVERYONE on that
#     list as having been prayed for. So Mom's world-count =
#       SUM(PrayerList.prayerCount) over every list where Mom has a
#       PrayerListEntry.
#     Example: Mom on lists 1–4, each list got 1,000 prayers => 4,000.
#     Fully derivable from PrayerListEntry + PrayerList.prayerCount.
#     No identity resolution needed — it's Mom's OWN subject's entries; we never
#     compare one user's "Mom" to another's.
#
#   IMPORTANT — do NOT sum tier-3 counts across subjects into a headline number.
#   Every subject on a list is credited that list's full prayerCount, so summing
#   subjects multiply-counts. Tier 3 is a per-subject "how held was this person"
#   figure ONLY. "How many prayers the world OFFERED" is a different number
#   (PrayerList.prayerCount itself) and must be surfaced as a distinct statement.
#
# LIVE world-count (tier 3) — client stitches static + live, sqlc never subscribes:
#   - sqlc query returns: (a) SUM(prayerCount) over the subject's CLOSED lists
#     ONLY (current list EXCLUDED), and (b) a boolean "is subject on the current
#     list".
#   - If (b) is true, the CLIENT adds the live current-list count from its
#     existing RTDB subscription on top of (a).
#   - Rule that prevents double-counting: sqlc owns everything UP TO BUT NOT
#     INCLUDING the current list; RTDB owns the current list. No overlap.
#   - Requires settle-on-close (see PrayerList.prayerCount): when a list stops
#     being current, the transition job freezes its final live count into
#     prayerCount, so the historical sum always reads finalized values.
#
# Also DERIVED (schema-brief §2): per-item "last prayed" (local date), the bead
# strand + "Off the list · N days" gaps (PrayerListEntry + PrayerList.sealVariant
# — no per-assembly outcome table), period rows, "Days in prayer this month",
# "carried on N lists", the answered running total, and prayer time per prayer /
# week / all time.
#
# STREAKS (2026-10-18 — docs/product/streaks-reminders.md):
#   - USER streak = consecutive LOCAL CALENDAR DAYS on which the user prayed
#     (≥5s) WITH THE LIST included. Personal-only days don't extend it.
#     Keeping the streak always satisfies the list gate ("keep your streak =
#     stay carried"). Supersedes the 2026-06-23 list-number streak.
#   - STORED on User (currentStreak, bestStreak, lastListLocalDate, grace
#     fields) — read on nearly every app open, and bestStreak is costly to
#     re-derive. Written ONLY by onPrayerLogged, from Prayer.localDate.
#     Grace is consumed LAZILY at the next list prayer (missed days ≤
#     graceDays → consume; else reset). Between prayers the app displays an
#     EFFECTIVE streak computed from the stored fields + today's date, so
#     missed days show correctly before the next write.
#     Risk to watch: drift — if it ever disagrees with derivation in practice,
#     switch to computed-and-cached.
#
# ANONYMOUS AGGREGATES THAT SURVIVE DELETION (stats-history.md):
#   PrayerList.prayerCount / prayerSeconds and DailyStats are INCREMENTED ON
#   WRITE by onPrayerLogged and never recounted from Prayer rows, so deleting
#   an account (which deletes its prayers and list entries) never reduces them.
#   - PER-SUBJECT streak is DERIVED, not stored. Denormalize a per-subject
#     streak column ONLY if it becomes a constantly-rendered hot value.
# ============================================================================


enum SubjectKind { SOUL INTENTION }

# Subject lifecycle — single axis, three honest states (replaces soft-delete +
# isRecoverable flags). Exactly one applies at a time:
#   ACTIVE   — normal; shows in the main list; eligible for daily lists.
#   ARCHIVED — hidden from the main view but RECOVERABLE; user can restore it
#              from an "archived" view. History intact. (e.g. removed in grief,
#              may want back.) RELEASE also lands here.
#   PURGED   — user said "gone gone"; hidden EVERYWHERE incl. the archive view;
#              not user-restorable. The ROW STILL PERSISTS underneath (frozen
#              history) so derived counts / past PrayerListEntry / PrayerSubjectLink
#              never break. NOTE: purged = UI-permanent, NOT data-erased. A true
#              data-rights (GDPR) erase is a separate future feature with its own
#              careful history handling — do not conflate the two.
# Filtering: main list = ACTIVE; archive view = ARCHIVED; PURGED = nowhere.
# The self-subject is forced ACTIVE and cannot be archived/purged (structural).
enum SubjectStatus { ACTIVE ARCHIVED PURGED }

# How an intention was resolved (docs/product/subjects.md):
#   ANSWERED — stays on the main view as "Answered · praying in gratitude"
#              until archived; prayers to it are gratitude prayers.
#   RELEASED — an outcome not hoped for; no gratitude implied; status is set
#              to ARCHIVED in the same write.
# Either way the item is never list-eligible again.
enum SubjectResolution { ANSWERED RELEASED }

# Which family of lists a PrayerList belongs to. Only GLOBAL exists today;
# future church/organization lists add values here (roadmap.md).
enum ListScope { GLOBAL }

# Where a name from outside the app came from (docs/product/list-lifecycle.md).
enum ExternalSource { SOCIAL BASE_SET }

# How a prayer ended: AMEN = the user finished it; AUTO = the auto-save job
# finalized an abandoned draft (shown with "~" on the estimated duration).
enum PrayerEndedBy { AMEN AUTO }

# MANUAL = the user prayed in their own words. GUIDED = "Help me pray"
# (post-MVP seam — docs/product/prayer-flow.md).
enum PrayerMode { MANUAL GUIDED }

# Reminder presets plus user-made custom reminders (docs/product/notifications.md).
enum ReminderSlot { MORNING MIDDAY EVENING CUSTOM }

# Trust tier of a list entry, for moderation: APP (an authenticated user's own
# items, higher trust), SOCIAL (a 🙏 from an internet account, lower trust —
# strict name filtering), BASE_SET (standing NamUs names).
enum EntrySource { APP SOCIAL BASE_SET }

# Per-name review gate. HELD entries are recoverable, not deleted.
# Users see "Held for review" / "Not printed · {reasonCategory}" — never silent.
enum ModerationStatus { APPROVED HELD EXCLUDED }

# User-facing reason for a held/excluded entry (list-lifecycle.md):
#   LANGUAGE        → "Language"
#   CONTACT_OR_LINK → "Contact info or links"
#   NAME_CHANGES    → "Frequent name changes"
#   OTHER           → "Didn't meet list guidelines"
enum ReasonCategory { LANGUAGE CONTACT_OR_LINK NAME_CHANGES OTHER }


# ----------------------------------------------------------------------------
# User
# ----------------------------------------------------------------------------
# One row per Firebase Auth user (Google, Apple, or Anonymous).
# Created server-side by onAuthUserCreated — the User ONLY, with displayName
# null. The self-PrayerSubject is created by the idempotent setSelfName
# callable at "What's your name?"; onboarding requires it before the main
# screen. Onboarding resume is state-based: no self name → name step.
#
# IMPORTANT: anonymous users who later sign in with Google/Apple must be LINKED
# (Firebase account linking), not treated as a fresh sign-in, or they lose their
# souls and history. If the Google/Apple account already has data, the user
# may choose mergeAccounts (OPERATIONS.md). This is auth-flow logic, but it's
# load-bearing here because the anonymous user is themselves a soul on the list.
#
# Account deletion (deleteAccount) deletes the user's PrayerListEntry rows, then
# this row; the required references below cascade to the user's subjects,
# prayers, links, and reminder rows. Stored list counts, prayerSeconds and
# DailyStats are unaffected (increment-on-write).
# ----------------------------------------------------------------------------
type User @table {
  id: String!                                # Firebase Auth UID as PK (always set by the server)

  # ONE name field (auth-onboarding.md): mirrors the self-subject's publicName.
  # The app greets with its first word. null until setSelfName; afterwards
  # written together with the self-subject.
  displayName: String
  authProvider: String                       # "google" | "apple" | "anonymous"
  isAnonymous: Boolean! @default(value: false)

  # Self-name edits: free until the self name is first printed (= its first
  # APPROVED entry on a PUBLISHED list), then once per 7 days, server-enforced
  # from this timestamp. Frequent changes are a moderation auto-flag at assembly.
  selfNameChangedAt: Timestamp

  # --- Device-synced settings ---
  locale: String                             # effective UI language (device or override), e.g. "en"
  timezone: String                           # IANA zone, updated from the device

  # --- Entitlement (server-written ONLY: billing events, trial start) ---
  planTier: String! @default(value: "free")   # "free" | "plan_a" | "plan_b" | ...
  # Size of the carried pool BEYOND the always-free self name. Each
  # effectively carried name or intention counts as one. Free = 1, and that
  # one is restricted to an intention under the self name ("Me"); premium =
  # basePremiumPool (server config, 10) for both the trial and the base tier.
  # Stored as a concrete number (not derived from planTier) so one-off grants
  # (promos, beta thank-yous) are possible without inventing fake plans.
  # EFFECTIVE limit is computed, never swept by a job: entitlementExpiresAt in
  # the past (and no active subscription) ⇒ the free limit.
  includeLimit: Int! @default(value: 1)
  # Reverse trial: 14 days of premium, no card, no auto-renew. Starts at the
  # user's FIRST PRAYER (set by onPrayerLogged), not at install.
  trialStartedAt: Timestamp
  # When the current premium entitlement (trial or paid) ends. null = none.
  # Includes any store billing grace period (still active during it). The
  # ≤7-day soft landing after ANY entitlement end (trial or lapsed
  # subscription) is computed at assembly from this — no extra field.
  entitlementExpiresAt: Timestamp

  # --- USER STREAK (STORED — exception to "derive on read") ---
  # Local calendar days prayed WITH THE LIST. See STREAKS in the header.
  currentStreak: Int! @default(value: 0)
  bestStreak: Int! @default(value: 0)
  # Local date of the user's last prayer with the list (from Prayer.localDate).
  # Replaces lastPrayedListNumber.
  lastListLocalDate: Date

  # --- Grace days (streaks-reminders.md) ---
  # Banked grace days, 0..cap (cap is server config, currently 2). Offered every
  # 7 real list days, accepted by the user; each consecutive missed day uses one.
  graceDays: Int! @default(value: 0)
  graceOfferPending: Boolean! @default(value: false)   # unanswered offer; offers don't stack
  graceOffersEnabled: Boolean! @default(value: true)   # false = "Don't offer again" (reversible)

  # UTC day this user was last counted in DailyStats.peoplePraying. Server-
  # written by onPrayerLogged: if it differs from the prayer's UTC day,
  # increment peoplePraying and set it.
  lastStatsDate: Date

  # --- Notification settings (notifications.md) ---
  listLiveOptIn: Boolean! @default(value: false)            # FCM "Today's list is live"
  showNamesInNotifications: Boolean! @default(value: true)  # false = fully blank reminders

  # --- Guided prayer seam (post-MVP, unused now) ---
  # Religion is special-category data: prayerVoice is only ever set together
  # with prayerVoiceConsentAt (explicit consent).
  prayerVoice: String
  prayerVoiceConsentAt: Timestamp

  createdAt: Timestamp! @default(expr: "request.time")
  # FUTURE: username: String @unique   (added when social/discovery/following ships)
}


# ----------------------------------------------------------------------------
# ReminderPreference  (daily prayer reminders — notifications.md)
# ----------------------------------------------------------------------------
# Synced server-side so they follow the user across devices; SCHEDULED ON THE
# DEVICE as local notifications (User.timezone gives the zone). Onboarding
# creates the presets with Morning enabled. Custom reminders (cap 5–7) are a
# later feature, but the table already supports them via slot = CUSTOM.
# One row per preset slot is enforced by the operations (a unique (user, slot)
# constraint would wrongly forbid multiple CUSTOM rows).
# ----------------------------------------------------------------------------
type ReminderPreference @table {
  user: User!
  slot: ReminderSlot!
  enabled: Boolean! @default(value: true)
  localTime: String!                         # "HH:mm", 24h, in the user's local zone
  label: String                              # custom reminders only
  createdAt: Timestamp! @default(expr: "request.time")
}


# ----------------------------------------------------------------------------
# PrayerSubject  (names AND intentions, unified)
# ----------------------------------------------------------------------------
# Unified table with a `kind` discriminator. Names and intentions share almost
# everything and always travel together (on lists, inside prayers); splitting
# them would only double joins.
#
# SOUL      = a "name": any top-level subject — a person, group, or cause
#             ("Mom", "Our parish", "Ukraine").
# INTENTION = a specific request with a lifecycle ("Find steady work"). Always
#             lives under a name (`parent`); can be resolved Answered/Released.
#
# Owner-enforced rules (no DB check available — operations/functions enforce):
#   - parent is REQUIRED for INTENTION and NULL for SOUL; the parent must be a
#     SOUL with the same owner; one level only.
#   - publicName cap: 40 (name) / 80 (intention), counted in grapheme
#     clusters, any script.
#   - Self-subject: forced ACTIVE, always carried (isCarried not toggleable),
#     not resolvable.
#   - Resolved items are never list-eligible.
#   - EFFECTIVE CARRY: an intention is carried only if
#     `isCarried && parent.isCarried`. Uncarrying a name leaves its
#     intentions' own flags intact; re-carrying the name brings them back
#     (over-limit flow if needed). The pool counts only effective items.
#   - Archive / purge on a name cascade to its intentions. Restore on a name
#     brings back ONLY intentions with archivedByCascade = true — never
#     Released ones or ones the user archived on their own.
#   - Soft abuse cap ~500 subjects per user (server check, not a paywall).
#
# STATS NOTE: a subject's "prayed for" counts (tiers 1/2/3) and per-subject
# streak are DERIVED, not stored here (see the COUNTS & STREAKS MODEL header).
# Add a denormalized counter/streak column ONLY if it becomes a hot read.
# ----------------------------------------------------------------------------
type PrayerSubject @table {
  owner: User!
  kind: SubjectKind!

  # The name an intention sits under. null for SOUL. (Promotes the deferred
  # relatedSubject seam to MVP.) Your own intentions sit under your self-row.
  parent: PrayerSubject

  # Two names with two audiences. Search matches both.
  # "simple" text-search config: names and intentions may be in any script, so
  # no English stemming.
  publicName: String! @searchable(language: "simple")    # printed on the list ("Gary Olson")
  personalLabel: String @searchable(language: "simple")  # shown as "alias", owner-only ("Dad"); self = "Me"

  note: String                               # optional detail

  # The owner's own soul, created by setSelfName. ALWAYS carried on
  # the list, free, pinned to the top, and NOT counted against includeLimit.
  # (Being carried is the dividend for participating, not a slot the user
  # spends.) sortOrder is ignored for the self-subject.
  isSelf: Boolean! @default(value: false)

  # The user's choice to print this item on the next list (the "your portion"
  # screen). Auto-set true on create while the pool has room; when the pool is
  # full a new item is saved for private prayer, clearly marked as not on the
  # list. Setting it beyond the entitlement is blocked (paywall), never silently
  # trimmed. Ignored for the self-subject, which is always carried. For an
  # intention this is its OWN flag; see EFFECTIVE CARRY above.
  isCarried: Boolean! @default(value: false)

  # Lifecycle (see SubjectStatus enum). Only ACTIVE subjects are list-eligible.
  status: SubjectStatus! @default(value: ACTIVE)
  # Intentions only: true when this intention was archived BECAUSE its name
  # was archived (it was ACTIVE at that moment). Restoring the name restores
  # exactly these and clears the flag.
  archivedByCascade: Boolean! @default(value: false)

  # Manual order only (names; intentions within their name). New items go to
  # the bottom. Carrying is chosen separately via isCarried.
  sortOrder: Int! @default(value: 0)

  # Monogram avatar tone = index into a curated palette (an index, not a hex,
  # so the palette can be retuned). null = use the default derived from a hash
  # of the subject id (not the name, so renaming doesn't change it).
  avatarTone: Int
  # Seam for photos (private Storage path, owner-only). Unused at MVP.
  avatarPath: String

  # Intentions only. Both set together; null = open.
  resolvedAt: Timestamp
  resolution: SubjectResolution

  createdAt: Timestamp! @default(expr: "request.time")

  # NOT groupId / visibility: groups will use a separate Share table
  # (subject → group or PUBLIC; many per subject). See roadmap.md.
}


# ----------------------------------------------------------------------------
# PrayerList  (one per day, per scope)
# ----------------------------------------------------------------------------
# The current list is the one with the latest currentFrom that has arrived
# (currentFrom ≤ now) in its scope. The flip is the exact cutoff: setting
# list N's closesAt (~5 min ahead, manual, ~6am MT) creates N+1 with
# currentFrom = closesAt; assembleNextList then settles N and fills N+1.
# Assembled as draft → reviewed → published (status), so names get a human
# checkpoint before being sealed. A list can be current while still draft (the
# app shows counts only).
# ----------------------------------------------------------------------------
type PrayerList @table @unique(fields: ["scope", "listNumber"]) {
  scope: ListScope! @default(value: GLOBAL)
  listNumber: Int!                           # sequential within scope; app List N = social List N
  listDate: Date!
  status: String! @default(value: "draft")    # "draft" | "published" — review gate before printing
  publishedAt: Timestamp

  # The exact cutoff for this list, set by Eric's skill (now + 5 min) shortly
  # before assembly. A prayer counts for this list if it STARTED before
  # closesAt and was committed before assembly runs; later arrivals fall to the
  # 30h rule. Mirrored to RTDB /lists/current so open apps show the in-app
  # "List N closes in 5 minutes" banner without re-fetching.
  closesAt: Timestamp
  # When this list became current = the previous list's closesAt. Setting a
  # list's closesAt creates the next list right away (draft, currentFrom =
  # that closesAt), so prayers started after the cutoff count toward it.
  currentFrom: Timestamp
  # When assembly settled this list (server-only). Until then its counters
  # still take prayers that started before closesAt; after it they never move.
  settledAt: Timestamp

  # When the VIDEO of this list went live. null while the list is current but
  # its video is still being filmed/edited — the app shows "the list is being
  # filmed, available shortly". (Option C: current flips at the ~6am cutoff,
  # the video follows ~8am.)
  videoPublishedAt: Timestamp
  # Firebase Storage object for the self-hosted in-app video (public-read
  # videos/ path).
  videoPath: String

  # Wax seal for this list, 0–6. Set by the publish step from the
  # weekday→wax mapping; stored so a future change to the rotation needs no
  # fallback logic. Colors the list row's seal and the detail-page beads.
  sealVariant: Int

  # Denormalized counts (server-written). Counters are a standard read
  # optimization, not "un-relational."
  soulCount: Int! @default(value: 0)
  intentionCount: Int! @default(value: 0)

  # prayerCount = total prayers offered toward THIS list.
  # LIVE while this list is current: incremented on each prayer commit and
  # MIRRORED to RTDB for the live display (clients subscribe to RTDB, not sqlc).
  # SETTLE-ON-CLOSE: when this list stops being current, the transition job
  # FREEZES the final live count into this field as its permanent settled
  # value. This is what makes the tier-3 world-count's historical sum read
  # finalized numbers and lets the client safely add the live RTDB value for
  # the current list only (no double-count). See the COUNTS & STREAKS MODEL header.
  # Increment-on-write: never recounted, so it survives account deletion.
  prayerCount: Int! @default(value: 0)
  # Total seconds prayed with this list. Same lifecycle as prayerCount:
  # incremented by onPrayerLogged, frozen at settle, never recounted.
  prayerSeconds: Int! @default(value: 0)

  createdAt: Timestamp! @default(expr: "request.time")
}


# ----------------------------------------------------------------------------
# DailyStats  (anonymous per-day aggregates — stats-history.md)
# ----------------------------------------------------------------------------
# ALL prayers, including personal-only ones. Incremented on write by
# onPrayerLogged and never recounted from Prayer rows (a scheduled function may
# finalize/roll the day, but never recounts), so account deletion doesn't
# reduce it. No identities. Server-written, ADMIN read.
# ----------------------------------------------------------------------------
type DailyStats @table(key: ["date"]) {
  date: Date!                                # UTC day of the prayer's END (prayedAt)
  prayers: Int! @default(value: 0)
  prayerSeconds: Int! @default(value: 0)
  peoplePraying: Int! @default(value: 0)     # distinct people who prayed that day
}


# ----------------------------------------------------------------------------
# PrayerListPost  (social posts for a list — one row per platform)
# ----------------------------------------------------------------------------
# Platforms (initial): youtube, instagram, threads, tiktok, facebook.
# (TikTok = reach/discovery only; no comment API. Threads = reply-only.)
# ----------------------------------------------------------------------------
type PrayerListPost @table(key: ["list", "platform"]) {
  list: PrayerList!
  platform: String!                          # "youtube" | "instagram" | "threads" | "tiktok" | "facebook"
  url: String
  externalId: String                         # platform post id
}


# ----------------------------------------------------------------------------
# ExternalPerson  (names from outside the app — list-lifecycle.md)
# ----------------------------------------------------------------------------
# SOCIAL   — a 🙏 commenter on any +Prayer post. Store ONLY the public display
#            name + platform user id. Carries the commenter only, never their
#            app subjects.
# BASE_SET — a standing name seeded onto every list (currently NamUs missing
#            children). externalId = NamUs case id. A resolved case gets
#            activeUntil set and leaves the base set quietly (not "answered").
# Enables de-dupe across lists and future handle→account linking (Q18).
# ----------------------------------------------------------------------------
type ExternalPerson @table @unique(fields: ["source", "platform", "externalId"]) {
  source: ExternalSource!
  platform: String!                          # "youtube" | "instagram" | ... ; "namus" for BASE_SET
  externalId: String!                        # platform user id, or NamUs case id
  displayName: String!
  firstSeen: Timestamp! @default(expr: "request.time")
  activeFrom: Timestamp                      # base set window
  activeUntil: Timestamp
}


# ----------------------------------------------------------------------------
# PrayerListEntry  (the assembled list — target of the join-and-write)
# ----------------------------------------------------------------------------
# Built server-side at transition time. publicName and kind are FROZEN
# snapshots: editing a subject later does NOT change an already-printed list.
#
# Each entry references EXACTLY ONE of `subject` (an app user's name or
# intention) or `externalPerson` (social / base set). SQL Connect has no CHECK
# constraint; the only writers (assembleNextList, the backfill, and
# mergeAccounts re-pointing entries) guarantee it. One row
# per (list, subject) and per (list, externalPerson); the NULL side of each
# unique constraint never collides.
#
# Assembly rule for a user who passed the list gate: their self name (always)
# + their effectively carried, ACTIVE, unresolved names/intentions up to the
# effective entitlement (free: intentions under "Me" only). Plus social
# ExternalPersons from the harvest and the active base set.
#
# Account deletion DELETES the user's entries (stored list counts are
# unaffected). The SET NULL on subject/owner is only a backstop.
#
# TIER-3 WORLD-COUNT SOURCE and BEAD STRAND SOURCE: this table records "subject
# X was on list N". With PrayerList.prayerCount / sealVariant it yields the
# world-count, the beads, and the gaps. No per-assembly outcome table.
#
# source = trust tier for moderation (EntrySource). moderationStatus gates
# individual names without killing the whole list (ModerationStatus,
# ReasonCategory).
# ----------------------------------------------------------------------------
type PrayerListEntry @table
  @unique(fields: ["list", "subject"])
  @unique(fields: ["list", "externalPerson"]) {
  list: PrayerList!
  subject: PrayerSubject                     # set for app entries
  externalPerson: ExternalPerson             # set for social / base-set entries
  owner: User                                # denormalized for per-user filtering; null for external

  # Groups an intention under its name's entry so print honors "your portion".
  parentEntry: PrayerListEntry

  kind: SubjectKind!                         # snapshot (external = SOUL)
  publicName: String!                        # FROZEN at assembly time

  source: EntrySource! @default(value: APP)
  moderationStatus: ModerationStatus! @default(value: APPROVED)
  heldReason: String                         # internal detail when held/excluded
  reasonCategory: ReasonCategory             # user-facing; set when held/excluded
}


# ----------------------------------------------------------------------------
# Prayer  (a completed, logged prayer — immutable history)
# ----------------------------------------------------------------------------
# Written ONCE: at Amen (logPrayer), or by the auto-save job for an abandoned
# draft (endedBy = AUTO). The live/in-progress state is in RTDB, NOT here —
# this table is clean completed history with no in-progress flag. `note` is
# the only editable field. No deletion (except account deletion).
#
# id is CLIENT-GENERATED (UUID v4) so an offline retry of the same prayer is
# idempotent; the default only covers server-side writers.
#
# A prayer can hold any combination of the current list and/or the user's own
# subjects, or nothing at all. communityList is set when the list was
# included; only such a prayer earns the user (and their carried items) a place
# on the next list and extends the streak.
#
# listContextNumber = the list number CURRENT WHEN THE PRAYER STARTED. Always
# set, independent of communityList. Places every prayer (including personal-
# only ones) on the list-cycle axis — powers tier-1 "list cycles I prayed for X".
#
# localDate/timezone = the device's local date and IANA zone at the START of
# the prayer (offline-safe). Streak, gaps, and monthly counts read localDate.
# ----------------------------------------------------------------------------
# Composite index serves the streak / month / gap reads (user + local date).
type Prayer @table @index(fields: ["userId", "localDate"]) {
  id: UUID! @default(expr: "uuidV4()")
  user: User!

  startedAt: Timestamp!
  prayedAt: Timestamp! @default(expr: "request.time")    # END time; client sends it (offline writes sync late)
  # ≥5s. Auto-saved prayers carry an estimate: last foreground moment + up to
  # 30 min, capped at 4h from start.
  durationSeconds: Int!
  localDate: Date!
  timezone: String!

  communityList: PrayerList                  # null = prayer without the list
  listContextNumber: Int!                    # current list number at START; always set

  endedBy: PrayerEndedBy! @default(value: AMEN)
  mode: PrayerMode! @default(value: MANUAL)  # GUIDED is a post-MVP seam

  note: String                               # optional private reflection; editable later (note-only)

  # DEFERRED past MVP (prayer-flow.md, 2026-10-18): nullable and unused.
  # Consent-gated when it ships; store precise, fuzz on output for any
  # aggregate display.
  latitude: Float
  longitude: Float

  # Server-only idempotency marker: set in the SAME statement that applies
  # this prayer's increments (list prayerCount/prayerSeconds, DailyStats,
  # streak). onMutationExecuted is at-least-once, so the increments are applied
  # only by the run that flips this from null. Never client-settable.
  countedAt: Timestamp
}


# ----------------------------------------------------------------------------
# PrayerSubjectLink  (which subjects were included in a given prayer)
# ----------------------------------------------------------------------------
# Many-to-many between Prayer and PrayerSubject.
# TIER-1 SOURCE: "I prayed for Mom N times" = count of these rows for Mom's
# subject across the user's prayers (see COUNTS & STREAKS MODEL header).
# Holding an intention also writes a link to its parent name (it counts toward
# the name). A link may later point to a subject owned by someone else (shared
# via a group): "my prayers for X" always filters by Prayer.user.
# ----------------------------------------------------------------------------
type PrayerSubjectLink @table(key: ["prayer", "subject"]) {
  prayer: Prayer!
  subject: PrayerSubject!
}
