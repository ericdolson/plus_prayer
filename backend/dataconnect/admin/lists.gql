# ============================================================================
# admin connector — list lifecycle: close, assemble, review, publish, print
# ============================================================================
# Morning flow (list-lifecycle.md): closeList (~5 min before) → assembleNextList
# → review held entries → print → publishList / publishListVideo (~8am).
# Native SQL rules: see ../connector/mutations.gql header.
# ============================================================================


# Lists not yet settled by assembly, oldest first: normally just the current
# list N, plus N+1 once N's closesAt has been set.
query GetOpenLists @auth(level: NO_ACCESS) {
  prayerLists(
    where: { scope: { eq: GLOBAL }, currentFrom: { isNull: false }, settledAt: { isNull: true } }
    orderBy: [{ listNumber: ASC }]
  ) {
    id
    listNumber
    listDate
    status
    currentFrom
    closesAt
  }
}

query GetList($id: UUID!) @auth(level: NO_ACCESS) {
  prayerList(key: { id: $id }) {
    id
    listNumber
    listDate
    status
    currentFrom
    closesAt
    settledAt
    sealVariant
    soulCount
  }
}

query GetListSummary($id: UUID!) @auth(level: NO_ACCESS) {
  prayerList(key: { id: $id }) {
    listNumber
    status
    soulCount
    intentionCount
    prayerCount
    prayerSeconds
  }
}

# The exact cutoff, in one statement: set list N's closesAt AND create list
# N+1 (draft, currentFrom = closesAt) — or move N+1's currentFrom if it
# already exists (closeList re-run before the cutoff). A prayer counts for N
# if it STARTED before closesAt; later prayers count toward N+1. Nothing is
# written once N is settled. Returns 1 when N+1 was created.
mutation CloseList(
  $listId: UUID!
  $closesAt: Timestamp!
  $nextListId: UUID!
  $nextListNumber: Int!
  $nextListDate: Date!
) @auth(level: NO_ACCESS) {
  _execute(
    sql: """
    WITH n AS (
      UPDATE prayer_list SET closes_at = $2::timestamptz
      WHERE id = $1::uuid AND settled_at IS NULL
      RETURNING id
    ), moved AS (
      UPDATE prayer_list SET current_from = $2::timestamptz
      WHERE scope = 'GLOBAL' AND list_number = $4::int AND settled_at IS NULL
        AND EXISTS (SELECT 1 FROM n)
      RETURNING id
    )
    INSERT INTO prayer_list (id, scope, list_number, list_date, status, current_from, created_at)
    SELECT $3::uuid, 'GLOBAL', $4::int, $5::date, 'draft', $2::timestamptz, now()
    WHERE EXISTS (SELECT 1 FROM n)
      AND NOT EXISTS (SELECT 1 FROM prayer_list WHERE scope = 'GLOBAL' AND list_number = $4::int)
    """
    params: [
      { _expr: "vars.listId" }
      { _expr: "vars.closesAt" }
      { _expr: "vars.nextListId" }
      { _expr: "vars.nextListNumber" }
      { _expr: "vars.nextListDate" }
    ]
  )
}


# ----------------------------------------------------------------------------
# assembleNextList — ONE statement; names never leave Postgres
# ----------------------------------------------------------------------------
# Settles list N (settledAt = $assemblyAt, so the caller can tell its own run
# from a concurrent one) and fills list N+1 (created by CloseList). If N is
# already settled nothing is written (every insert joins `settle`), so a
# double run can never duplicate entries; the function reports it.
#
# $social: JSON array of { platform, externalId, displayName } from the 🙏
# harvest (de-duplicated, validated, display names truncated to 40 graphemes
# by the function). People are upserted into ExternalPerson (latest display
# name) and entered once each.
#
# GATE (schema-brief §6, §10): a user qualifies with a prayer that included
# the list and either (a) communityList = the closing list and started before
# its closesAt (and is committed now, i.e. before assembly), or (b) ended in
# the $gateHours before closesAt. A prayer after the cutoff belongs to N+1
# only, so one prayer never earns two lists.
#
# PER USER: the self name always; then effectively carried items (an
# intention only if its name is carried or is the self), ACTIVE, unresolved,
# in the user's order (self's intentions first, then each name followed by
# its intentions), up to the effective limit:
#   active entitlement                         → includeLimit
#   no active entitlement, carry fits free     → $freeLimit (intentions under Me)
#   no active entitlement, over free, ended
#     within $softLandingDays                  → includeLimit (soft landing)
#   otherwise                                  → 0 (self name only)
#
# AUTO-FLAG (→ HELD + reasonCategory), case-insensitive:
#   LANGUAGE        — a blocklist term: $blockWords as whole words / phrases
#                     (text split on spaces + punctuation), $blockSubstrings
#                     anywhere (Han / Kana / Hangul / Thai, 2+ characters)
#   CONTACT_OR_LINK — $contactPattern (phone / email / URL)
#   NAME_CHANGES    — the self name changed since it was last printed
#                     (after the latest published list it was APPROVED on)
# Base-set names are not flagged. Counts are set afterwards by RecountList.
mutation AssembleList(
  $closingListId: UUID!
  $closesAt: Timestamp!
  $assemblyAt: Timestamp!
  $nextListId: UUID!
  $gateHours: Int!
  $freeLimit: Int!
  $softLandingDays: Int!
  $blockWords: Any!
  $blockSubstrings: Any!
  $contactPattern: String!
  $social: Any!
) @auth(level: NO_ACCESS) {
  _execute(
    sql: """
    WITH settle AS (
      UPDATE prayer_list SET settled_at = $3::timestamptz
      WHERE id = $1::uuid AND settled_at IS NULL
      RETURNING id
    ), new_list AS (
      SELECT l.id FROM prayer_list l, settle WHERE l.id = $7::uuid AND l.settled_at IS NULL
    ), bw AS (
      SELECT DISTINCT value AS w
      FROM jsonb_array_elements_text(CASE WHEN jsonb_typeof($8::jsonb) = 'array' THEN $8::jsonb ELSE '[]'::jsonb END)
      WHERE value <> ''
    ), bs AS (
      SELECT DISTINCT value AS w
      FROM jsonb_array_elements_text(CASE WHEN jsonb_typeof($10::jsonb) = 'array' THEN $10::jsonb ELSE '[]'::jsonb END)
      WHERE value <> ''
    ), social_in AS (
      SELECT DISTINCT ON (x.platform, x."externalId") x.platform, x."externalId" AS external_id,
        x."displayName" AS display_name
      FROM jsonb_to_recordset(CASE WHEN jsonb_typeof($11::jsonb) = 'array' THEN $11::jsonb ELSE '[]'::jsonb END)
        AS x(platform text, "externalId" text, "displayName" text)
      WHERE x.platform IS NOT NULL AND x."externalId" IS NOT NULL AND x."displayName" IS NOT NULL
      ORDER BY x.platform, x."externalId"
    ), people AS (
      INSERT INTO external_person (source, platform, external_id, display_name, first_seen)
      SELECT 'SOCIAL', s.platform, s.external_id, s.display_name, now()
      FROM social_in s, new_list
      ON CONFLICT (source, platform, external_id) DO UPDATE SET display_name = EXCLUDED.display_name
      RETURNING id, display_name
    ), social_ins AS (
      INSERT INTO prayer_list_entry
        (list_id, external_person_id, kind, public_name, source, moderation_status, reason_category)
      SELECT n.id, f.id, 'SOUL', f.display_name, 'SOCIAL',
        (CASE WHEN f.flag IS NULL THEN 'APPROVED' ELSE 'HELD' END)::moderation_status,
        f.flag::reason_category
      FROM new_list n, (
        SELECT p.id, p.display_name,
          CASE
            WHEN EXISTS (SELECT 1 FROM bw WHERE strpos(' ' || regexp_replace(lower(p.display_name), '[[:space:][:punct:]]+', ' ', 'g') || ' ', ' ' || bw.w || ' ') > 0)
              OR EXISTS (SELECT 1 FROM bs WHERE strpos(lower(p.display_name), bs.w) > 0)
              THEN 'LANGUAGE'
            WHEN p.display_name ~* $9::text THEN 'CONTACT_OR_LINK'
          END AS flag
        FROM people p
      ) f
      RETURNING id
    ), base_ins AS (
      INSERT INTO prayer_list_entry
        (list_id, external_person_id, kind, public_name, source, moderation_status)
      SELECT n.id, e.id, 'SOUL', e.display_name, 'BASE_SET', 'APPROVED'
      FROM new_list n, external_person e
      WHERE e.source = 'BASE_SET'
        AND (e.active_from IS NULL OR e.active_from <= $3::timestamptz)
        AND (e.active_until IS NULL OR e.active_until > $3::timestamptz)
      RETURNING id
    ), q AS (
      SELECT DISTINCT p.user_id FROM prayer p
      WHERE p.community_list_id IS NOT NULL
        AND ((p.community_list_id = $1::uuid AND p.started_at < $2::timestamptz)
          OR (p.prayed_at >= $2::timestamptz - make_interval(hours => $4::int)
            AND p.prayed_at < $2::timestamptz))
    ), u AS (
      SELECT usr.id, usr.include_limit, usr.self_name_changed_at, usr.entitlement_expires_at,
        COALESCE(usr.entitlement_expires_at > $3::timestamptz, false) AS active
      FROM "user" usr JOIN q ON q.user_id = usr.id
    ), selfs AS (
      SELECT s.id, s.owner_id, s.public_name,
        CASE
          WHEN EXISTS (SELECT 1 FROM bw WHERE strpos(' ' || regexp_replace(lower(s.public_name), '[[:space:][:punct:]]+', ' ', 'g') || ' ', ' ' || bw.w || ' ') > 0)
            OR EXISTS (SELECT 1 FROM bs WHERE strpos(lower(s.public_name), bs.w) > 0)
            THEN 'LANGUAGE'
          WHEN s.public_name ~* $9::text THEN 'CONTACT_OR_LINK'
          WHEN u.self_name_changed_at > (
            SELECT max(pl.current_from) FROM prayer_list_entry pe JOIN prayer_list pl ON pl.id = pe.list_id
            WHERE pe.subject_id = s.id AND pe.moderation_status = 'APPROVED' AND pl.status = 'published')
            THEN 'NAME_CHANGES'
        END AS flag
      FROM prayer_subject s JOIN u ON u.id = s.owner_id
      WHERE s.is_self
    ), cand AS (
      SELECT s.id, s.owner_id, s.kind, s.parent_id, s.public_name,
        COALESCE(par.is_self, false) AS under_self,
        CASE WHEN par.is_self THEN -2147483648 ELSE COALESCE(par.sort_order, s.sort_order) END AS o1,
        COALESCE(s.parent_id, s.id) AS o2,
        CASE WHEN s.parent_id IS NULL THEN -2147483648 ELSE s.sort_order END AS o3,
        s.created_at AS o4
      FROM prayer_subject s
      JOIN u ON u.id = s.owner_id
      LEFT JOIN prayer_subject par ON par.id = s.parent_id
      WHERE NOT s.is_self AND s.status = 'ACTIVE' AND s.resolved_at IS NULL AND s.is_carried
        AND (s.parent_id IS NULL OR (par.status = 'ACTIVE' AND (par.is_self OR par.is_carried)))
    ), st AS (
      SELECT owner_id, count(*) AS n, bool_and(kind = 'INTENTION' AND under_self) AS fits_free
      FROM cand GROUP BY owner_id
    ), lim AS (
      SELECT u.id AS owner_id,
        CASE
          WHEN u.active THEN u.include_limit
          WHEN st.n IS NULL OR (st.n <= $5::int AND st.fits_free) THEN $5::int
          WHEN u.entitlement_expires_at > $3::timestamptz - make_interval(days => $6::int)
            THEN u.include_limit
          ELSE 0
        END AS n
      FROM u LEFT JOIN st ON st.owner_id = u.id
    ), picked AS (
      SELECT r.*,
        CASE
          WHEN EXISTS (SELECT 1 FROM bw WHERE strpos(' ' || regexp_replace(lower(r.public_name), '[[:space:][:punct:]]+', ' ', 'g') || ' ', ' ' || bw.w || ' ') > 0)
            OR EXISTS (SELECT 1 FROM bs WHERE strpos(lower(r.public_name), bs.w) > 0)
            THEN 'LANGUAGE'
          WHEN r.public_name ~* $9::text THEN 'CONTACT_OR_LINK'
        END AS flag
      FROM (
        SELECT c.*, row_number() OVER (PARTITION BY c.owner_id ORDER BY c.o1, c.o2, c.o3, c.o4) AS rn
        FROM cand c
      ) r JOIN lim ON lim.owner_id = r.owner_id
      WHERE r.rn <= lim.n
    ), self_ins AS (
      INSERT INTO prayer_list_entry
        (list_id, subject_id, owner_id, kind, public_name, source, moderation_status, reason_category)
      SELECT n.id, s.id, s.owner_id, 'SOUL', s.public_name, 'APP',
        (CASE WHEN s.flag IS NULL THEN 'APPROVED' ELSE 'HELD' END)::moderation_status,
        s.flag::reason_category
      FROM new_list n, selfs s
      RETURNING id, subject_id
    ), name_ins AS (
      INSERT INTO prayer_list_entry
        (list_id, subject_id, owner_id, kind, public_name, source, moderation_status, reason_category)
      SELECT n.id, p.id, p.owner_id, p.kind, p.public_name, 'APP',
        (CASE WHEN p.flag IS NULL THEN 'APPROVED' ELSE 'HELD' END)::moderation_status,
        p.flag::reason_category
      FROM new_list n, picked p WHERE p.parent_id IS NULL
      RETURNING id, subject_id
    )
    INSERT INTO prayer_list_entry
      (list_id, subject_id, owner_id, parent_entry_id, kind, public_name, source,
       moderation_status, reason_category)
    SELECT n.id, p.id, p.owner_id, COALESCE(ni.id, si.id), p.kind, p.public_name, 'APP',
      (CASE WHEN p.flag IS NULL THEN 'APPROVED' ELSE 'HELD' END)::moderation_status,
      p.flag::reason_category
    FROM new_list n
    JOIN picked p ON p.parent_id IS NOT NULL
    LEFT JOIN name_ins ni ON ni.subject_id = p.parent_id
    LEFT JOIN self_ins si ON si.subject_id = p.parent_id
    """
    params: [
      { _expr: "vars.closingListId" }
      { _expr: "vars.closesAt" }
      { _expr: "vars.assemblyAt" }
      { _expr: "vars.gateHours" }
      { _expr: "vars.freeLimit" }
      { _expr: "vars.softLandingDays" }
      { _expr: "vars.nextListId" }
      { _expr: "vars.blockWords" }
      { _expr: "vars.contactPattern" }
      { _expr: "vars.blockSubstrings" }
      { _expr: "vars.social" }
    ]
  )
}

# Denormalized soul / intention counts from the entries. Draft lists count
# everything not EXCLUDED (held entries are still pending review); at publish
# ($approvedOnly) only what is printed. Idempotent.
mutation RecountList($listId: UUID!, $approvedOnly: Boolean!) @auth(level: NO_ACCESS) {
  _execute(
    sql: """
    UPDATE prayer_list pl SET
      soul_count = (SELECT count(*) FROM prayer_list_entry e
        WHERE e.list_id = pl.id AND e.kind = 'SOUL'
          AND (e.moderation_status = 'APPROVED' OR (NOT $2::boolean AND e.moderation_status = 'HELD'))),
      intention_count = (SELECT count(*) FROM prayer_list_entry e
        WHERE e.list_id = pl.id AND e.kind = 'INTENTION'
          AND (e.moderation_status = 'APPROVED' OR (NOT $2::boolean AND e.moderation_status = 'HELD')))
    WHERE pl.id = $1::uuid
    """
    params: [{ _expr: "vars.listId" }, { _expr: "vars.approvedOnly" }]
  )
}


# ----------------------------------------------------------------------------
# Review, print, publish
# ----------------------------------------------------------------------------

# Review only what the auto-flags held.
query GetHeldEntries($listId: UUID!) @auth(level: NO_ACCESS) {
  prayerListEntries(
    where: { list: { id: { eq: $listId } }, moderationStatus: { eq: HELD } }
  ) {
    id
    kind
    source
    publicName
    reasonCategory
    heldReason
  }
}

query GetEntry($id: UUID!) @auth(level: NO_ACCESS) {
  prayerListEntry(key: { id: $id }) {
    id
    list { id status }
  }
}

mutation ModerateEntry(
  $entryId: UUID!
  $status: ModerationStatus!
  $reasonCategory: ReasonCategory
  $heldReason: String
) @auth(level: NO_ACCESS) @transaction {
  prayerListEntry_updateMany(
    where: { id: { eq: $entryId } }
    data: { moderationStatus: $status, reasonCategory: $reasonCategory, heldReason: $heldReason }
  ) @check(expr: "this == 1", message: "ENTRY_NOT_FOUND")
}

# What gets printed: APPROVED entries with the keys the print step needs to
# group a portion (owner → name → its intentions via parentEntry).
query GetListForPrint($listId: UUID!) @auth(level: NO_ACCESS) {
  prayerList(key: { id: $listId }) {
    id
    listNumber
    listDate
    status
    soulCount
    intentionCount
  }
  prayerListEntries(
    where: { list: { id: { eq: $listId } }, moderationStatus: { eq: APPROVED } }
  ) {
    id
    kind
    source
    publicName
    owner { id }
    parentEntry { id }
    subject { isSelf sortOrder }
  }
}

# Draft → published after review (then RecountList approvedOnly).
mutation PublishList($listId: UUID!, $sealVariant: Int!) @auth(level: NO_ACCESS) @transaction {
  prayerList_updateMany(
    where: { id: { eq: $listId } }
    data: { status: "published", publishedAt_expr: "request.time", sealVariant: $sealVariant }
  ) @check(expr: "this == 1", message: "LIST_NOT_FOUND")
}

# ~8am: the video and its social posts, one statement. $posts: JSON array of
# { platform, url, externalId }.
mutation PublishListVideo($listId: UUID!, $videoPath: String!, $posts: Any!)
@auth(level: NO_ACCESS) {
  _execute(
    sql: """
    WITH l AS (
      UPDATE prayer_list SET video_path = $2, video_published_at = now()
      WHERE id = $1::uuid
      RETURNING id
    )
    INSERT INTO prayer_list_post (list_id, platform, url, external_id)
    SELECT DISTINCT ON (x.platform) l.id, x.platform, x.url, x."externalId"
    FROM l, jsonb_to_recordset(CASE WHEN jsonb_typeof($3::jsonb) = 'array' THEN $3::jsonb ELSE '[]'::jsonb END) AS x(platform text, url text, "externalId" text)
    WHERE x.platform IS NOT NULL
    ORDER BY x.platform
    ON CONFLICT (list_id, platform) DO UPDATE
      SET url = EXCLUDED.url, external_id = EXCLUDED.external_id
    """
    params: [{ _expr: "vars.listId" }, { _expr: "vars.videoPath" }, { _expr: "vars.posts" }]
  )
}


# ----------------------------------------------------------------------------
# Backfill + base set
# ----------------------------------------------------------------------------

# Backfill (publishing/lists.json → lists 1..N) and test fixtures: insert a
# list with explicit numbers, dates, and counts. Backfilled past lists get a
# settledAt (their numbers are final); only the current one is left open.
mutation InsertList(
  $id: UUID!
  $listNumber: Int!
  $listDate: Date!
  $status: String!
  $currentFrom: Timestamp
  $closesAt: Timestamp
  $settledAt: Timestamp
  $publishedAt: Timestamp
  $sealVariant: Int
  $soulCount: Int = 0
  $intentionCount: Int = 0
  $prayerCount: Int = 0
) @auth(level: NO_ACCESS) {
  prayerList_insert(
    data: {
      id: $id
      scope: GLOBAL
      listNumber: $listNumber
      listDate: $listDate
      status: $status
      currentFrom: $currentFrom
      closesAt: $closesAt
      settledAt: $settledAt
      publishedAt: $publishedAt
      sealVariant: $sealVariant
      soulCount: $soulCount
      intentionCount: $intentionCount
      prayerCount: $prayerCount
    }
  )
}

# Base set import (NamUs): platform is always "namus". A resolved case gets
# activeUntil and leaves the base set quietly.
mutation UpsertBaseSetPerson($externalId: String!, $displayName: String!, $activeFrom: Timestamp, $activeUntil: Timestamp)
@auth(level: NO_ACCESS) {
  _execute(
    sql: """
    INSERT INTO external_person (source, platform, external_id, display_name, first_seen, active_from, active_until)
    VALUES ('BASE_SET', 'namus', $1, $2, now(), $3::timestamptz, $4::timestamptz)
    ON CONFLICT (source, platform, external_id) DO UPDATE SET
      display_name = EXCLUDED.display_name,
      active_from = EXCLUDED.active_from,
      active_until = EXCLUDED.active_until
    """
    params: [{ _expr: "vars.externalId" }, { _expr: "vars.displayName" }, { _expr: "vars.activeFrom" }, { _expr: "vars.activeUntil" }]
  )
}
